<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order Success')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-5 text-center">
    <div class="success-box">
        <div class="display-1">✓</div>
        <h1>Order Placed Successfully!</h1>
        <p class="lead">Your order number is <strong>#<span th:text="${order.id}">1</span></strong>.</p>
        <p>Total: ₹<strong th:text="${order.totalAmount}">0</strong></p>
        <a href="/orders" class="btn btn-primary">View Orders</a>
        <a href="/products" class="btn btn-outline-secondary">Continue Shopping</a>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>

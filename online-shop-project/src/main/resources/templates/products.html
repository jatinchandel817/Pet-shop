<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <h1>Products</h1>
        <form class="d-flex" action="/products" method="get">
            <input class="form-control me-2" name="search" th:value="${search}" placeholder="Search products...">
            <button class="btn btn-outline-primary">Search</button>
        </form>
    </div>
    <div class="row g-4" th:if="${!products.isEmpty()}">
        <div class="col-sm-6 col-lg-4" th:each="product : ${products}">
            <div class="card product-card h-100">
                <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}">
                <div class="card-body d-flex flex-column">
                    <span class="badge text-bg-light align-self-start mb-2" th:text="${product.category}">Category</span>
                    <h5 th:text="${product.name}">Product</h5>
                    <p class="text-muted" th:text="${product.description}">Description</p>
                    <div class="mt-auto">
                        <h4>₹<span th:text="${product.price}">0</span></h4>
                        <p class="small" th:text="'Stock: ' + ${product.stockQuantity}">Stock</p>
                        <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="alert alert-warning" th:if="${products.isEmpty()}">No products found.</div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
